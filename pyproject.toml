[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "trinetx_preprocessing"
version = "0.2.0"
description = "TriNetX preprocessing utilities and pipeline scaffolding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow>=15",
    "pyyaml",
    "pytest",
    "ruff",
]

[project.scripts]
trinetx-preprocessing = "trinetx_preprocessing.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "*.ipynb",
    "Executed Notebooks/",
    "Notebooks/",
    "data/",
    ".uv_cache/",
    ".venv/",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.hatch.build.targets.wheel.force-include]
"config/concept_sets" = "trinetx_preprocessing/catalog"

[tool.ruff.lint.per-file-ignores]
"src/trinetx_preprocessing/encounters/legacy/*.py" = ["E501"]
