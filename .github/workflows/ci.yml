name: CI

on:
  push:
    branches: [main, refactor-pipeline]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Build and install the upstream wheel outside the checkout
        run: |
          uv python install 3.11
          uv export --locked --no-emit-project > "$RUNNER_TEMP/reader-dependencies.txt"
          uv venv --python 3.11 "$RUNNER_TEMP/reader-env"
          uv pip sync --python "$RUNNER_TEMP/reader-env/bin/python" "$RUNNER_TEMP/reader-dependencies.txt"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv pip install --python "$RUNNER_TEMP/reader-env/bin/python" --no-deps "$RUNNER_TEMP"/wheels/*.whl
          cp scripts/verify_encounter_reader_e2e.py scripts/verify_return_reader_e2e.py "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/source-fixture/tests/fixtures" "$RUNNER_TEMP/source-fixture/config" "$RUNNER_TEMP/source-fixture/scripts"
          cp tests/test_cohort_source.py "$RUNNER_TEMP/source-fixture/tests/"
          cp tests/test_cohort_source_calendar_history.py "$RUNNER_TEMP/source-fixture/tests/"
          cp scripts/verify_calendar_transport_e2e.py "$RUNNER_TEMP/source-fixture/scripts/"
          cp -R tests/fixtures/example_data "$RUNNER_TEMP/source-fixture/tests/fixtures/"
          cp -R config/concept_sets "$RUNNER_TEMP/source-fixture/config/"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH reader-env/bin/python verify_encounter_reader_e2e.py encounter-reader --require-installed
          env -u PYTHONPATH reader-env/bin/python verify_return_reader_e2e.py return-reader --require-installed
          env -u PYTHONPATH reader-env/bin/python source-fixture/scripts/verify_calendar_transport_e2e.py calendar-transport --require-installed
          digest="$(sha256sum calendar-transport/receipt.json | cut -d ' ' -f 1)"
          env -u PYTHONPATH reader-env/bin/python source-fixture/scripts/verify_calendar_transport_e2e.py calendar-transport --verify --receipt-sha256 "$digest"
          env -u PYTHONPATH reader-env/bin/python -m pytest -q source-fixture/tests/test_cohort_source.py::test_trusted_population_receipt_binds_exact_source_and_passed_gates --basetemp source-products --junitxml source-reader.xml
      - name: Retain synthetic installed-reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-installed-readers
          path: |
            ${{ runner.temp }}/encounter-reader
            ${{ runner.temp }}/return-reader
            ${{ runner.temp }}/calendar-transport
            ${{ runner.temp }}/wheels
            ${{ runner.temp }}/reader-dependencies.txt
            ${{ runner.temp }}/source-fixture
            ${{ runner.temp }}/source-products
            ${{ runner.temp }}/source-reader.xml
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.11
          uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run python -m pytest -q
      - name: Retained return execution E2E
        run: |
          uv run python scripts/verify_return_execution_e2e.py "$RUNNER_TEMP/return-execution"
          uv run python scripts/verify_return_product_e2e.py "$RUNNER_TEMP/return-product"
          uv run python scripts/verify_return_lock_e2e.py "$RUNNER_TEMP/return-lock"
          uv run python scripts/verify_return_worker_lifetime_e2e.py "$RUNNER_TEMP/return-worker-lifetime"
          for name in return-execution return-product return-lock return-worker-lifetime; do
            digest="$(sha256sum "$RUNNER_TEMP/$name/e2e.json" | cut -d ' ' -f 1)"
            uv run python scripts/verify_e2e.py --verify "$RUNNER_TEMP/$name" --manifest-sha256 "$digest"
          done
      - name: Retained preprocessing closeout E2Es
        run: |
          for name in calendar_transport encounter_closeout; do
            uv run python "scripts/verify_${name}_e2e.py" "$RUNNER_TEMP/$name"
            digest="$(sha256sum "$RUNNER_TEMP/$name/receipt.json" | cut -d ' ' -f 1)"
            uv run python "scripts/verify_${name}_e2e.py" "$RUNNER_TEMP/$name" --verify --receipt-sha256 "$digest"
          done
      # These drivers use only the reviewed synthetic fixtures. Authentication
      # keys are local replay state and are never uploaded with public evidence.
      - name: Retain synthetic return evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-return-e2e
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/return-execution
            ${{ runner.temp }}/return-product
            ${{ runner.temp }}/return-lock
            ${{ runner.temp }}/return-worker-lifetime
            ${{ runner.temp }}/calendar_transport
            ${{ runner.temp }}/encounter_closeout
            !${{ runner.temp }}/return-*/**/*.key
